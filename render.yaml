services:
  - type: web
    name: drones-help-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Add any other required environment variables below, 
      # or set them securely in the Render dashboard.
      # - key: PORT
      #   value: 5000
